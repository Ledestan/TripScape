<!doctype html>
<!--
  行旅识景 TripScape / index
  创建日期: 2026-10-09
  说明: 单页应用入口，内联启动页样式（首屏不等 JS），其余交给前端路由。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9bb7d7" />
    <meta name="description" content="行旅识景 · 世界著名地标智能识别平台" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>行旅识景 · TripScape</title>
    <script>
      // 首屏暗色模式（避免闪烁）：读裸字符串 key
      (function () {
        var t = localStorage.getItem("tripscape-theme-plain");
        if (
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* ==================================================================
         启动片头：黑场 → 星野 → 地球弧升起 → 标题落下 → 进度 → 淡出
         纯 CSS 实现，不阻塞首屏；素材只有 stars.jpg 与 earth-arc.jpg
         ================================================================== */
      html,
      body {
        margin: 0;
        background: #04070d;
      }
      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: #04070d;
        color: #f4f7fb;
        z-index: 9999;
        overflow: hidden;
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
      }

      /* 星野：比容器大一圈，缓慢漂移时不会露出边缘 */
      .boot-loading .stars {
        position: absolute;
        inset: -8%;
        background: #04070d url("/stars.jpg") no-repeat center center;
        background-size: cover;
        opacity: 0;
        animation:
          stars-in 1.6s ease-out 0.15s both,
          drift 48s ease-in-out 1.6s infinite alternate;
      }

      /* 暗角：把视线收到画面中央，避免星空抢戏 */
      .boot-loading .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          120% 88% at 50% 42%,
          rgba(4, 7, 13, 0) 38%,
          rgba(4, 7, 13, 0.55) 78%,
          rgba(4, 7, 13, 0.9) 100%
        );
      }

      /* 地平线以上的大气辉光：地球"有大气"的唯一提示 */
      .boot-loading .horizon {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 140%;
        height: min(60vh, 560px);
        transform: translateX(-50%);
        background: radial-gradient(
          52% 100% at 50% 100%,
          rgba(120, 180, 255, 0.26) 0%,
          rgba(90, 140, 220, 0.1) 42%,
          transparent 72%
        );
        opacity: 0;
        animation:
          fade-in 1.8s ease-out 0.5s both,
          breath 7s ease-in-out 2.4s infinite;
      }

      /* 地球弧：宽度拉满、高度按窗口缩放，从下缘缓缓升起 */
      .boot-loading .arc {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 100%;
        height: min(46vh, 420px);
        background: url("/earth-arc.jpg") no-repeat bottom center;
        background-size: 100% auto;
        -webkit-mask-image: linear-gradient(to top, black 52%, transparent 100%);
        mask-image: linear-gradient(to top, black 52%, transparent 100%);
        opacity: 0;
        animation: arc-rise 1.9s cubic-bezier(0.16, 0.84, 0.32, 1) 0.75s both;
      }

      /* 文字舞台：逐行落下，节奏比动效本身更重要 */
      .boot-loading .stage {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(640px, 86vw);
        margin-bottom: 6vh;
        text-align: center;
      }
      .boot-loading .kicker {
        margin: 0;
        font-size: clamp(10px, 1.05vw, 12px);
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: rgba(196, 214, 238, 0.62);
        opacity: 0;
        animation: rise-in 1s ease-out 0.95s both;
      }
      .boot-loading .title {
        margin: 0;
        font-family: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC",
          "SimSun", serif;
        font-weight: 400;
        font-size: clamp(36px, 6.4vw, 68px);
        line-height: 1.06;
        color: #f6f9fd;
        text-shadow: 0 0 48px rgba(140, 190, 255, 0.28);
        opacity: 0;
        animation: title-in 1.5s cubic-bezier(0.22, 0.68, 0.28, 1) 1.05s both;
      }
      .boot-loading .rule {
        width: 64px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(216, 178, 106, 0.9),
          transparent
        );
        opacity: 0;
        animation: rule-grow 1s ease-out 1.55s both;
      }
      .boot-loading .subtitle {
        margin: 0;
        font-size: clamp(12px, 1.35vw, 15px);
        font-weight: 300;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        line-height: 1.7;
        color: rgba(224, 233, 244, 0.78);
        opacity: 0;
        animation: rise-in 1s ease-out 1.7s both;
      }
      .boot-loading .progress {
        position: relative;
        width: min(240px, 62vw);
        height: 2px;
        margin-top: 6px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
        opacity: 0;
        animation: fade-in 0.8s ease-out 1.9s both;
      }
      .boot-loading .progress i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          rgba(124, 192, 255, 0.95),
          rgba(216, 178, 106, 0.95)
        );
        animation: progress 2.4s cubic-bezier(0.4, 0, 0.2, 1) 2s forwards;
      }
      .boot-loading .tip {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        color: rgba(255, 255, 255, 0.42);
        opacity: 0;
        animation:
          fade-in 0.8s ease-out 2.2s both,
          breath 3.6s ease-in-out 3s infinite;
      }

      /* 小屏：标题与进度收窄，弧线压低，保证文字不被地球压住 */
      @media (max-width: 640px) {
        .boot-loading .stage {
          gap: 12px;
          width: 88vw;
          margin-bottom: 9vh;
        }
        .boot-loading .arc {
          height: min(38vh, 280px);
        }
        .boot-loading .horizon {
          height: min(48vh, 420px);
        }
        .boot-loading .rule {
          width: 48px;
        }
      }
      /* 矮屏（横屏笔记本）：压缩间距，弧线更矮 */
      @media (max-height: 560px) {
        .boot-loading .stage {
          gap: 10px;
          margin-bottom: 4vh;
        }
        .boot-loading .arc {
          height: 32vh;
        }
        .boot-loading .horizon {
          height: 40vh;
        }
      }
      /* 超宽屏：弧线放大，避免地球在画面里显得太小 */
      @media (min-aspect-ratio: 21/9) {
        .boot-loading .arc {
          height: 44vh;
        }
      }
      /* 尊重系统"减少动态效果"：直接呈现最终画面 */
      @media (prefers-reduced-motion: reduce) {
        .boot-loading .stars,
        .boot-loading .horizon,
        .boot-loading .arc,
        .boot-loading .kicker,
        .boot-loading .title,
        .boot-loading .rule,
        .boot-loading .subtitle,
        .boot-loading .progress,
        .boot-loading .tip {
          animation: none !important;
          opacity: 1;
        }
        .boot-loading .progress i {
          animation: none !important;
          width: 100%;
        }
        .boot-loading .arc {
          transform: translateX(-50%);
        }
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes stars-in {
        from { opacity: 0; }
        to { opacity: 0.72; }
      }
      @keyframes drift {
        from { transform: translate3d(-1.2%, -1%, 0) scale(1.03); }
        to { transform: translate3d(1.2%, 1%, 0) scale(1.05); }
      }
      @keyframes arc-rise {
        from { opacity: 0; transform: translate(-50%, 14%); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      @keyframes breath {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.9; }
      }
      @keyframes rise-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes title-in {
        from {
          opacity: 0;
          transform: translateY(16px);
          letter-spacing: 0.44em;
        }
        to {
          opacity: 1;
          transform: none;
          letter-spacing: 0.16em;
        }
      }
      @keyframes rule-grow {
        from { opacity: 0; transform: scaleX(0); }
        to { opacity: 1; transform: scaleX(1); }
      }
      @keyframes progress {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- 启动片头放在 #root 之外：React 挂载会清空 #root，不会波及此节点 -->
    <!-- 容器内联星野背景：CSS 生效前的第一帧就只显示星空，不闪白、不闪文字 -->
    <div
      class="boot-loading"
      id="boot-screen"
      style="background: #04070d url('/stars.jpg') center center / cover no-repeat"
    >
      <div class="stars" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="horizon" aria-hidden="true"></div>
      <div class="arc" aria-hidden="true"></div>
      <!-- 内联 opacity:0 是兜底：动画会覆盖它，但样式未就绪时文字绝不提前出现 -->
      <div class="stage" role="status" aria-live="polite">
        <p class="kicker" style="opacity: 0">世界著名地标 · 识别与叙事档案</p>
        <h1 class="title" style="opacity: 0">行旅识景</h1>
        <div class="rule" aria-hidden="true" style="opacity: 0"></div>
        <p class="subtitle" style="opacity: 0">把每一座地标，读成一段被讲述的地方</p>
        <div class="progress" aria-hidden="true" style="opacity: 0"><i></i></div>
        <p class="tip" style="opacity: 0">正在展开世界…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
