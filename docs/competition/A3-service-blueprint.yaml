# A3 服务蓝图 · 叙事流通层（Service Blueprint · Narrative Circulation Layer）
# ---------------------------------------------------------------------------
# 定位：路径 A 展板核心素材。本文是"系统结构反向工程"的结构草稿，
#       不是最终视觉设计；节点/线路可被翻译成地铁线路图，站序与换乘已在字段里给出。
#
# 视觉隐喻（已落到字段，不再只停在注释）：
#   三条线在同一组换乘站交汇——
#     叙事线（用户看见的动作）/ 证据线（系统真实做事的地方）/ 治理线（约束与失败语义）
#     换乘站：CARD（叙事卡片）、FRAGMENT（匿名碎片）
#   每条线有 stations 有序站点；line 给"属于哪条线"，lane 给"服务蓝图泳道"
#   （front_stage / back_stage / support），stage_order 给横向时间轴位置。
#
# 追溯规则：每个节点必须给出 source.kind + source.ref + evidence（代码位置）。
#           source.kind ∈ {route, api, table, service}；组件只能出现在 evidence 里做佐证。
#           没有 ref 的节点不得进入展板（SPEC §3.6 / §4.2 可追溯性）。

artifact: A3-service-blueprint
version: 2
spec: "SPEC.md §3.6（叙事流通层结构草稿）"
project: "TripScape 2.0"
feature_flag: "无（2026-11-25 起叙事层是 2.0 本体，默认启用）"
reading_order: "left_to_right（stage_order 越小越靠左）"
edge_semantics: >-
  nodes[*].next 收三类**跨线**边——rail（跨泳道行车）、feedback（stage 递减的回边）、
  constraint（同 stage 的横向约束），分类见 edge_kinds；同一条线内部的相邻关系由
  lines[].stations 的顺序给出，不写成 next，避免同一关系在边集里出现两遍或形成同线自环。
axis_note: >-
  line 与 lane 在本层恰好 1:1（每条线只落在对应泳道），这是设计选择而非冗余：
  line 给"叙事/证据/治理"三条轨道（供地铁图配色与命名），lane 给服务蓝图的
  泳道语义（front_stage / back_stage / support，供蓝图表纵向分层）；
  stage_order 则是横向时间轴（跨线共享，同一 stage_order 表示同一叙事时刻）。
  三个字段分别服务三种展板画法，若后续出现跨泳道的线，line 与 lane 会分离。

legend:
  rails:
    - {line: narrative, color: "#2E7DF7", width: 6, meaning: "用户可见的叙事动作"}
    - {line: evidence, color: "#6B7280", width: 4, meaning: "系统真实触点（识别/检索/存储）"}
    - {line: governance, color: "#C2410C", width: 3, dash: "2 4", meaning: "约束与失败语义（回边用虚线）"}
  markers:
    - {id: transfer_hub, shape: "双环圆", meaning: "换乘站（CARD / FRAGMENT）"}
    - {id: station, shape: "实心圆", meaning: "普通站点"}
    - {id: feedback, shape: "虚线箭头（反向）", meaning: "与 stage_order 反向的回边（见 edge_kinds.feedback）"}
    - {id: rail, shape: "实线箭头（颜色取出发线；跨泳道时取 front_stage 侧线色）", meaning: "跨线行车边（见 edge_kinds.rail）"}
    - {id: constraint, shape: "横向无箭头虚线", meaning: "同一 stage 的横向约束（G1->FRAGMENT / G2->F4 / G3->F5 / G5->B6 / G4->B2）"}
  bands:
    - {lane: front_stage, order: 1, visibility: "用户可见"}
    - {lane: back_stage, order: 2, visibility: "用户不可见（内部触点）"}
    - {lane: support, order: 3, visibility: "约束与失败语义"}
  line_of_visibility: "front_stage 与 back_stage 之间画可见性分界线（服务蓝图的定义性装置）；support 画在分线下方。"
  timeline_note: >-
    stage_order 1–6 是跨线共享的叙事时刻：1 提供照片 → 2 定位地标 → 3 检索 →
    4 组装卡片 → 5 沉淀 / 碎片池 → 6 拾取 / 失败语义。
    "线跳过某个 stage" 表示该线在该时刻无事可做，不是缺站：叙事线在 3/4 无站点（由证据线完成，
    用户侧只是等待），证据线在 1 无站点（用户提供照片发生在识别之前），治理线在 1–3 无站点
    （约束只在有动作可约束时才出现）。stage 5 较密：B4/B5/F3/F4/FRAGMENT/G1/G2；
    F4（投递，stage 5）与 F3（加入手账，stage 5）同一时刻，但按 403 校验
    （`deliver_fragment` 先查 JournalCard）排在 F3 之后；F5 在 stage 6。
    展板可在 stage 5 做局部放大，而不是把整条线拉平。

edge_kinds:
  note: >-
    本表只给 nodes[*].next 里的边**分类**，不新增任何关系；权威边集仍是
    nodes[*].next（跨线/换乘）+ lines[].stations（同线相邻）。
    rail = 正常行车边；feedback = 与 stage_order 反向的回边；constraint = 同一叙事时刻上的横向约束。
  rail: ["F1->B1", "F2->B2", "F3->B5", "F4->FRAGMENT", "B2->CARD", "B4->G3"]
  feedback: ["B5->CARD", "F5->FRAGMENT", "G5->B1"]
  constraint: ["G1->FRAGMENT", "G2->F4", "G3->F5", "G5->B6", "G4->B2"]
  stage_check: >-
    feedback 三条均为 stage 递减（B5 5→CARD 4、F5 6→FRAGMENT 5、G5 6→B1 2）；
    constraint 五条均为 stage 相等（G1 5→FRAGMENT 5、G2 5→F4 5、G3 6→F5 6、G5 6→B6 6、G4 4→B2 4）。

lines:
  - id: narrative
    name: "叙事线（前台行为，用户可见）"
    color_role: "primary"
    direction: "left_to_right"
    stations: [F1, F2, F3, F4, F5]
    note: "用户从一张照片走到一条陌生人接住的碎片"
  - id: evidence
    name: "证据线（后台触点，系统真实动作）"
    color_role: "backstage"
    direction: "left_to_right"
    stations: [B1, B3, B2, B4, B5, B6]
    note: "识别 -> 检索 -> 卡片组装 -> 碎片存储 -> 手账存储 ->（既有）审核治理"
  - id: governance
    name: "治理线（约束、匿名、失败语义）"
    color_role: "support"
    direction: "left_to_right"
    stations: [G4, G1, G2, G3, G5]
    note: "匿名 / 额度 / 单次拾取 / 坐标绑定 / 失败语义（按 stage_order 单调排列：4,5,5,6,6）"

interchanges:
  - id: CARD
    name: "叙事卡片（换乘站）"
    kind: transfer_hub
    table: ts_narrative_card
    stage_order: 4
    why: "识别路径与地标现建路径在此合流；加入手账、投递都以它为单位"
    incoming: [B2, B5]
    outgoing: [F3, F4]
    outgoing_semantics: "这是语义出边（从卡片出发的两个动作），不是 next 边：动作本身的 rail 边写作 F3->B5 与 F4->FRAGMENT；制版时从 CARD 向 F3/F4 画实线即可，不要与 next 边重复落笔。"
    evidence_continuation: "证据线：B2（组装）进站，续出到 B4（碎片存储）；B5 是证据线回读端。"
    transfer_note: "B2（组装）与 B5（手账回读）从证据线进站；F3/F4 从卡片出发。F2 是读取动作（GET /api/narrative/card/{id} → latest_card，**无卡时现建**），卡片仍由 B2 产出，故 F2 不列为 CARD 的入边。"
  - id: FRAGMENT
    name: "匿名碎片（换乘站）"
    kind: transfer_hub
    table: ts_narrative_fragment
    pickup_table: ts_narrative_fragment_pickup
    stage_order: 5
    why: "叙事离开作者、进入陌生人拾取池的唯一出口"
    incoming: [F4, G1, F5]
    outgoing: []
    outgoing_semantics: "拾取动作 F5 是本站的出站动作，但它的 feedback 边写作 F5->FRAGMENT（见 edge_kinds.feedback：拾取时回池读取，stage 6→5）；为避免与 outgoing 重复画成双向箭头，此处不重复列出。"
    storage_writer: B4
    evidence_continuation: "证据线：B4（碎片存储与拾取记录）与本站同 stage，故不画跨线入边，只作 storage_writer 声明。"
    transfer_note: "F4（投递动作）、G1（响应层匿名）、F5（拾取时回读）三条边汇入本站；B4 是碎片表的写入方，与本站同 stage 供台。F4 -> FRAGMENT -> F5 是叙事线与证据线唯一的必经换乘。"

nodes:
  # ----------------------------- 叙事线（前台行为） -----------------------------
  - id: F1
    line: narrative
    lane: front_stage
    stage_order: 1
    name: "拍摄 / 提供一张照片"
    description: "用户给出照片，系统据此识别地标；照片可以是识别请求里的上传文件。"
    source:
      kind: api
      ref: "POST /api/recognition/recognize（multipart: image）"
    evidence:
      - "backend/api/recognition.py::recognize_sync"
      - "backend/api/recognition.py::_validate（PNG/JPG + 大小上限）"
    next: [B1]

  - id: F2
    line: narrative
    lane: front_stage
    stage_order: 2
    name: "选择切面（= 选择一个地标，取得它的切面集）"
    description: >-
      当前实现没有独立的"切面选择器"：用户在地球层选择地标，即选择该地标的整套切面
      （纪年 / 检索上下文 / 地理 / 确信度 / 影像 / 身份）。此简化在 known_gaps 中显式声明，
      不冒充已存在的独立交互。
    source:
      kind: api
      ref: "GET /api/narrative/card/{landmark_id}（真正返回切面字段的端点）"
    evidence:
      - "backend/api/landmarks.py::spots（地标入口 marker：坐标/热度，不含切面字段）"
      - "backend/api/narrative.py::get_card（读取路径：latest_card() → as_card()；无卡时现建）"
      - "backend/services/narrative_service.py::latest_card"
      - "frontend/src/features/narrative/NarrativeHud.tsx（data-testid=narrative-landmark-entry）"
      - "frontend/src/stores/narrative.ts::enterLandmark"
    next: [B2]

  - id: F3
    line: narrative
    lane: front_stage
    stage_order: 5
    name: "加入手账（只读沉淀）"
    description: "把卡片放进个人手账；卡片成为只读快照，不提供编辑/覆盖接口。"
    source:
      kind: api
      ref: "POST /api/narrative/journal/cards"
    evidence:
      - "backend/api/narrative.py::add_card"
      - "backend/services/narrative_service.py::add_card_to_journal"
      - "ts_narrative_journal_card（unique_together=(user, card)）"
    next: [B5]

  - id: F4
    line: narrative
    lane: front_stage
    stage_order: 5
    name: "匿名投递到地标"
    description: "把手账中的一张卡片投递到某个地标，投递者身份不进入任何响应。"
    source:
      kind: api
      ref: "POST /api/narrative/fragments"
    evidence:
      - "backend/api/narrative.py::deliver"
      - "backend/services/narrative_service.py::deliver_fragment"
      - "ts_narrative_fragment"
    next: [FRAGMENT]

  - id: F5
    line: narrative
    lane: front_stage
    stage_order: 6
    name: "拾取一条碎片"
    description: "探索到该地标的人可以拾取一条自己没拾取过、也不是自己投递的碎片。"
    source:
      kind: api
      ref: "GET /api/narrative/fragments/pick?landmark_id="
    evidence:
      - "backend/api/narrative.py::pick（GET，无可用碎片 404；未登录 401）"
      - "backend/api/narrative.py::pick_by_id（POST /api/narrative/fragments/{id}/pick，重复拾取 409）"
      - "backend/services/narrative_service.py::pick_fragment / pick_fragment_by_id"
      - "frontend/src/features/narrative/LandmarkNarrativePanel.tsx（data-testid=narrative-pick）"
    next: [FRAGMENT]

  # ----------------------------- 证据线（后台触点） -----------------------------
  - id: B1
    line: evidence
    lane: back_stage
    stage_order: 2
    name: "识别（DINOv2 + FAISS 检索式识别）"
    description: "上传图像 -> 向量 -> 索引最近邻 -> top-3 候选与置信度；低置信度返回候选列表。"
    source:
      kind: service
      ref: "services/recognition_service.py::recognize_image"
    evidence:
      - "backend/services/recognition_service.py::_build_result（confidence / low_confidence / candidates）"
      - "backend/services/retrieval_engine.py（引擎与索引装载）"
      - "runtime/index/landmarks.faiss + landmarks.meta.json"
    next: []

  - id: B3
    line: evidence
    lane: back_stage
    stage_order: 3
    name: "RAG 检索（向量 + BM25 + RRF）"
    description: "按地标锁定文章，混合检索返回带章节标签与 RRF 分数的片段。"
    source:
      kind: service
      ref: "services/article_qa.py::ArticleIndex.search"
    evidence:
      - "backend/services/article_qa.py（K=60、RRF 融合）"
      - "runtime/index/qa_chunks.json（144 chunks / 26 地标 / 8 类章节）"
    next: []

  - id: B2
    line: evidence
    lane: back_stage
    stage_order: 4
    name: "卡片组装（切面提取）"
    description: "把地标与其文章库句、检索结果组装为 SPEC 固定字段集的叙事卡片。"
    source:
      kind: service
      ref: "services/narrative_service.py::build_narrative_card"
    evidence:
      - "backend/services/narrative_service.py::_time_fragments（纪年抽取，缺失即 null）"
      - "backend/services/narrative_service.py::_rag_snippets（检索片段）"
      - "backend/services/narrative_service.py::_geo（坐标绑定 ts_landmark）"
      - "backend/api/recognition.py::_attach_narrative_card（识别响应并入字段集）"
    next: [CARD]

  - id: B4
    line: evidence
    lane: back_stage
    stage_order: 5
    name: "碎片存储与拾取记录"
    description: "碎片绑定 (card, landmark, delivered_by)；拾取记录在 (fragment, user) 上唯一。"
    source:
      kind: table
      ref: "ts_narrative_fragment / ts_narrative_fragment_pickup"
    evidence:
      - "backend/apps/narrative/models.py::NarrativeFragment"
      - "backend/apps/narrative/models.py::FragmentPickup（unique_together=(fragment, user)）"
    next: [G3]

  - id: B5
    line: evidence
    lane: back_stage
    stage_order: 5
    name: "手账持久化（写）+ 刷新取回（读）"
    description: >-
      写入发生在 F3 的同一次请求内（add_card_to_journal 同步 get_or_create），
      本节点表示"此后可被读回"：GET /api/narrative/journal 在刷新后取回手账条目。
      写与读不是两个延迟站点，而是同一条记录在不同时刻的两种访问。
    source:
      kind: api
      ref: "GET /api/narrative/journal"
    evidence:
      - "backend/api/narrative.py::my_journal"
      - "backend/services/narrative_service.py::journal_cards"
      - "backend/services/narrative_service.py::add_card_to_journal（写入在 F3 请求内完成）"
      - "e2e/narrative-journal.spec.ts（刷新后仍在）"
    next: [CARD]

  - id: B6
    line: evidence
    lane: back_stage
    stage_order: 6
    name: "审核治理（既有，叙事层未接入）"
    description: >-
      既有手账模型带 status（pending/approved/rejected）与软删字段，地标页只展示
      is_public 且 approved 的手账；叙事层新增的 ts_narrative_* 表无 status 字段、
      不接这条审核流——这是本轮显式边界（known_gaps K3），按 SPEC §3.6 归入后台触点。
    source:
      kind: table
      ref: "ts_journal.status"
    evidence:
      - "backend/apps/journals/models.py::Journal.STATUS"
      - "backend/api/journals.py::landmark_journals（is_public + status=approved 过滤）"
      - "backend/apps/narrative/models.py（四表均无 status 字段）"
    next: []

  # ----------------------------- 治理线（支持流程） -----------------------------
  - id: G1
    line: governance
    lane: support
    stage_order: 5
    name: "匿名性（响应层剥离身份）"
    description: "碎片响应只含 anonymous=true 与来源卡片摘要，不含投递者字段；库内 delivered_by 仅用于额度与自投排除。"
    source:
      kind: service
      ref: "services/narrative_service.py::fragment_payload"
    evidence:
      - "backend/services/narrative_service.py::fragment_payload（anonymous 固定 true）"
      - "tests/backend/test_s3_fragment_pickup.py（断言无 deliveredBy/user 字段）"
    next: [FRAGMENT]

  - id: G2
    line: governance
    lane: support
    stage_order: 5
    name: "投递额度（同地标 ≤ 3）"
    description: "同一用户对同一地标最多 3 条碎片；第 4 条返回 409 与中文额度消息。"
    source:
      kind: service
      ref: "services/narrative_service.py::fragment_limit / deliver_fragment"
    evidence:
      - "backend/services/narrative_service.py::fragment_limit（settings.NARRATIVE_MAX_FRAGMENTS_PER_LANDMARK）"
      - "tests/backend/test_s3_fragment_delivery.py（前 3 次 200，第 4 次 409）"
    next: [F4]

  - id: G3
    line: governance
    lane: support
    stage_order: 6
    name: "单次拾取（同碎片 ≤ 1 次/人）"
    description: "数据库唯一约束 + 服务层显式拒绝；随机拾取会排除已拾取与自投碎片。"
    source:
      kind: table
      ref: "ts_narrative_fragment_pickup.unique_together=(fragment, user)"
    evidence:
      - "backend/apps/narrative/models.py::FragmentPickup"
      - "backend/services/narrative_service.py::pick_fragment / pick_fragment_by_id"
      - "tests/backend/test_s3_fragment_pickup.py（二次拾取 409 / 无可用 404）"
    next: [F5]

  - id: G4
    line: governance
    lane: support
    stage_order: 4
    name: "坐标绑定"
    description: "卡片的 geo 直接取自 Landmark 表，碎片再绑定 landmark_id，叙事与地点强一致。"
    source:
      kind: service
      ref: "services/narrative_service.py::_geo"
    evidence:
      - "backend/services/narrative_service.py::_geo（lat/lon/place/country/region）"
      - "ts_landmark（lat/lon 来源列）"
    next: [B2]

  - id: G5
    line: governance
    lane: support
    stage_order: 6
    name: "失败语义与低置信度"
    description: >-
      低置信度返回候选列表而不硬判；识别失败/索引缺失返回 success=false 的 200 响应；
      限额与重复拾取返回 409；开关关闭时端点 404。
    source:
      kind: service
      ref: "services/recognition_service.py::_build_result"
    evidence:
      - "backend/services/recognition_service.py（RECOG_CONFIDENCE_THRESHOLD 判定）"
      - "backend/config/settings/base.py::RECOG_CONFIDENCE_THRESHOLD"
      - "backend/api/narrative.py::_landmark_or_404 / NarrativeError(404)"
      - "tests/backend/test_a4_low_confidence_gate.py（低置信度给候选）"
    next: [B1, B6]

failure_modes:
  - code: 400
    at: [F1]
    where: "上传文件类型/大小/空文件校验失败"
    evidence: "backend/api/recognition.py::_validate（HttpError(400, ...)）"
  - code: "200 + success=false"
    at: [B1, F1]
    where: "索引缺失或未识别出地标（业务失败不升级为 HTTP 错误）"
    evidence: "backend/services/recognition_service.py::recognize_image（return {'success': False, ...}）"
  - code: 401
    at: [F3, F4, F5, B5]
    where: "未登录访问（add_card / my_journal / deliver / pick / pick_by_id 五个叙事端点 @login_required，抛 HttpError(401)；get_card 用 OptionalAuth，故 F2 不在 401 范围）"
    evidence: "backend/apps/core/auth.py::login_required（raise HttpError(401, \"请先登录\")）；backend/api/narrative.py 五处 @login_required；get_card 为 auth=OptionalAuth()"
  - code: 404
    at: [F2, F3, F4, F5]
    where: "地标不存在 / 卡片不存在 / 无可用碎片（开关已移除，不再有「关闭态 404」）"
    evidence: "backend/api/narrative.py::_landmark_or_404 / NarrativeError(404)（叙事层无特性开关）"
  - code: 403
    at: [F4, F1, F2]
    where: >-
      (a) 投递的卡片不在自己的手账里（服务层）；(b) 账号被封禁/限登时，认证层直接 403，
      该 403 可出现在任何已登录/可选认证节点（含 F1 拍照上传与 F2 取卡片）。
    evidence: "backend/services/narrative_service.py::deliver_fragment（403）；backend/apps/core/auth.py::check_account_status / GlobalAuth / OptionalAuth（raise HttpError(403, reason)）"
  - code: 409
    at: [F4, B4, F5]
    where: "同地标第 4 条投递 / 同一碎片二次拾取"
    evidence: "backend/services/narrative_service.py::deliver_fragment / pick_fragment_by_id"
  - code: 422
    at: [F3, F4, F5]
    where: "请求体/查询参数校验失败（AddCardIn / DeliverIn 的字段；F5 缺或非法 landmark_id 同样 422）"
    evidence: "backend/api/narrative.py::AddCardIn / DeliverIn；backend/api/narrative.py::pick（landmark_id: int）"

known_gaps:
  - id: K1
    text: >-
      前端 JournalEditWindow 调用 /api/uploads/image，但当前后端未挂载该路由
      （backend/api/__init__.py 的文档串提到 /api/uploads/...，实际无 uploads router）。
      属升级前既有缺口，不在 S1–S3 范围，本轮不改动；叙事卡片的 photo 在无上传 URL 时
      回退地标百科图（ts_landmark.image_url），并在 A4 如实说明。
  - id: K2
    text: >-
      "选择切面"没有独立选择器：用户选择地标即取得该地标的切面集（见 F2）。
      这是显式简化，不声明已存在未实现的交互。
  - id: K3
    text: >-
      ts_narrative_* 四张表无 status 字段，未接既有审核流（ts_journal.status 的
      pending/approved/rejected）；审核治理仍是既有手账/评论链路的职责，见 B6。
  - id: K4
    text: >-
      后端 deliver_fragment 只校验"卡片存在 / 地标存在 / 卡片在该用户手账 / 该用户在该地标额度"，
      不校验 card.landmark_id == landmark_id；跨地标投递在 API 层是允许的
      （s3-manual-curl.log 中源卡片 landmarkId=1、投递到 landmark 8 即为例证）。
      前端两个调用点行为不同：手账层传卡片自身的 landmarkId（JournalCardsPanel onDeliver），
      地标层传当前进入的 landmark_id（NarrativeHud deliver.mutate），两者都不是服务层约束；
      本轮不新增校验（超出 §2 范围）。
  - id: K5
    text: >-
      两个换乘站（CARD/FRAGMENT）是结构抽象，不对应独立进程或服务；它们就是两张表
      （ts_narrative_card / ts_narrative_fragment）与各自的序列化函数。

